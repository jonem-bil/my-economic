# 记账分类树 —— 模板
#
# 用法：
#   复制本文件为 scripts/config.yaml，再按自己的习惯改。
#
# 为什么不在仓库里放真的 config.yaml：
#   真实配置含个人账户名和自定义分类，属于隐私信息，
#   已在 .gitignore 中排除，请勿提交。

categories:
  支出:
    餐饮:
      - 早餐
      - 午餐
      - 晚餐
      - 水果零食
      - 饮料
    交通:
      - 公共交通
      - 打车
      - 加油充电
      - 停车费
    购物:
      - 日用品
      - 数码电器
      - 服饰鞋包
    居家:
      - 水电燃气
      - 手机电话
      - 宽带网费
      - 住宿房租
    娱乐:
      - 电影
      - 游戏
      - 旅游
    教育:
      - 书籍
      - 学费
    医疗:
      - 医疗药品
      - 挂号门诊
    其他: []

  收入:
    工资薪水: []
    兼职外快: []
    红包: []
    退款: []
    利息收入: []
    生活费: []

  转账:
    转账: []
    信用卡还款: []

  借入:
    向朋友借款: []
    网贷: []

  借出:
    借朋友: []
    临时垫付: []

  还款:
    信用卡还款: []
    花呗还款: []

  收款:
    借款收回: []
    垫付款收回: []

accounts:
  - 示例账户
